<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">TreeMaker symbol - reversed cut</title>
  <!--
    White-on-dark version, thinned about 2 units per side: reversed type irradiates, so the same
    geometry drawn at full weight looks heavier when knocked out. Use on ink or brand backgrounds.
  -->
